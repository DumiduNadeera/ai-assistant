name: orysys-enterprise-assistant

services:
  api:
    build:
      context: .
      target: api
    environment:
      APP_ENV: container
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      LANGSMITH_API_KEY: "${LANGSMITH_API_KEY:-}"
      LANGSMITH_PROJECT: "${LANGSMITH_PROJECT:-orysys-enterprise-assistant}"
      LANGSMITH_TRACING: "${LANGSMITH_TRACING:-false}"
      LANGSMITH_ENDPOINT: "${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}"
      LANGSMITH_WORKSPACE_ID: "${LANGSMITH_WORKSPACE_ID:-}"
      PINECONE_API_KEY: "${PINECONE_API_KEY:-}"
      PINECONE_INDEX: "${PINECONE_INDEX:-}"
      PINECONE_NAMESPACE: "${PINECONE_NAMESPACE:-enterprise-demo}"
      LLM_PROVIDER: "${LLM_PROVIDER:-deterministic}"
      LLM_MODEL: "${LLM_MODEL:-gpt-5-mini}"
      LLM_BASE_URL: "${LLM_BASE_URL:-}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_TIMEOUT_SECONDS: "${LLM_TIMEOUT_SECONDS:-90}"
      LLM_MAX_OUTPUT_TOKENS: "${LLM_MAX_OUTPUT_TOKENS:-320}"
      OLLAMA_THINK: "${OLLAMA_THINK:-false}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-text-embedding-3-small}"
      EMBEDDING_DIMENSIONS: "${EMBEDDING_DIMENSIONS:-1536}"
      RATE_LIMIT_CAPACITY: "${RATE_LIMIT_CAPACITY:-20}"
      RATE_LIMIT_REFILL_PER_SECOND: "${RATE_LIMIT_REFILL_PER_SECOND:-0.2}"
      RETRIEVAL_TIMEOUT_SECONDS: "${RETRIEVAL_TIMEOUT_SECONDS:-8}"
      TOOL_TIMEOUT_SECONDS: "${TOOL_TIMEOUT_SECONDS:-5}"
      GRAPH_TIMEOUT_SECONDS: "${GRAPH_TIMEOUT_SECONDS:-120}"
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  frontend:
    build:
      context: .
      target: frontend
    environment:
      API_BASE_URL: http://api:8000
      STREAM_READ_TIMEOUT_SECONDS: "${STREAM_READ_TIMEOUT_SECONDS:-150}"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
