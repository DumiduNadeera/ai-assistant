[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-ai-assistant"
version = "0.2.0"
description = "Secure and observable enterprise knowledge and operations assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "langgraph>=0.2,<2",
  "langsmith>=0.1,<1",
  "mcp>=1,<2",
  "openai>=1.68,<3",
  "pinecone>=5,<8",
  "pydantic-settings>=2.5,<3",
  "requests>=2.32,<3",
  "streamlit>=1.40,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
minversion = "8.3"
addopts = [
  "-ra",
  "--strict-config",
  "--strict-markers",
  "--cov=app",
  "--cov-branch",
  "--cov-report=term-missing:skip-covered",
  "--cov-report=xml",
  "--cov-fail-under=70",
]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "api: HTTP contract and endpoint tests",
  "security: authentication, authorization, and boundary tests",
  "unit: isolated business logic tests",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
files = ["app"]
follow_imports = "skip"
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
